name: Neovesta CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      # Backend build and test
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Build and test backend
        working-directory: ./backend
        run: mvn -B package --file pom.xml
      
      # Frontend build and test
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
      
      - name: Test frontend
        working-directory: ./frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'  # Only run on push, not PRs
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./backend.Dockerfile
          push: false
          tags: neovesta-backend:latest
          outputs: type=docker,dest=/tmp/backend-image.tar
      
      - name: Build frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./frontend.Dockerfile
          push: false
          tags: neovesta-frontend:latest
          outputs: type=docker,dest=/tmp/frontend-image.tar
      
      - name: Upload backend image as artifact
        uses: actions/upload-artifact@v3
        with:
          name: backend-image
          path: /tmp/backend-image.tar
          retention-days: 1
      
      - name: Upload frontend image as artifact
        uses: actions/upload-artifact@v3
        with:
          name: frontend-image
          path: /tmp/frontend-image.tar
          retention-days: 1