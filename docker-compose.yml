version: '3.8'

services:
  backend:
    image: aidar673/neovesta-backend:latest
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/neovesta_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=aidar
    depends_on:
      - db
    networks:
      - neovesta-network

  frontend:
    image: aidar673/neovesta-frontend:latest
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - neovesta-network

  db:
    image: postgres:14
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=neovesta_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=aidar
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - neovesta-network

networks:
  neovesta-network:
    driver: bridge

volumes:
  postgres-data: