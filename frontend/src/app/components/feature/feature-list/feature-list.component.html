<app-header></app-header>
<div class="container mx-auto px-4 py-8">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
      <div>
        <h1 class="text-3xl font-bold text-gray-800 dark:text-white">Residence Services</h1>
        <p class="text-gray-600 dark:text-gray-300 mt-1">Manage all services and amenities available in your residence</p>
      </div>
      <a 
        *ngIf="isManager"
        routerLink="/features/new" 
        class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2 rounded-lg shadow-md transition-all flex items-center gap-2"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
        </svg>
        Add Service
      </a>
    </div>
  
    <!-- Filters -->
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-md p-6 mb-8">
      <h2 class="text-lg font-semibold mb-4 text-gray-800 dark:text-white">Filters</h2>
      <form [formGroup]="filterForm" (ngSubmit)="applyFilters()" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <!-- Search -->
        <div class="col-span-1 md:col-span-2">
          <label for="search" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Search</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
              </svg>
            </div>
            <input 
              type="text" 
              id="search" 
              formControlName="search"
              placeholder="Search by name or description..." 
              class="pl-10 w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white py-2 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none"
            />
          </div>
        </div>
  
        <!-- Feature Type -->
        <div>
          <label for="featureType" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Service Type</label>
          <select 
            id="featureType" 
            formControlName="featureType"
            class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white py-2 px-3 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none"
          >
            <option [ngValue]="null">All Types</option>
            <option [value]="FeatureType.SUBSCRIPTION_BASED">Subscription Based</option>
            <option [value]="FeatureType.RESERVATION_BASED">Reservation Based</option>
          </select>
        </div>
  
        <!-- Feature Category -->
        <div>
          <label for="featureCategory" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Category</label>
          <select 
            id="featureCategory" 
            formControlName="featureCategory"
            class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white py-2 px-3 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none"
          >
            <option [ngValue]="null">All Categories</option>
            <option *ngFor="let category of FeatureCategory | keyvalue" [value]="category.value">
              {{ formatFeatureCategory(category.value) }}
            </option>
          </select>
        </div>
  
        <!-- Active Status -->
        <div>
          <label for="active" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Status</label>
          <select 
            id="active" 
            formControlName="active"
            class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white py-2 px-3 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none"
          >
            <option [ngValue]="null">All Statuses</option>
            <option [ngValue]="true">Active</option>
            <option [ngValue]="false">Inactive</option>
          </select>
        </div>
  
        <!-- Sort -->
        <div>
          <label for="sortBy" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Sort By</label>
          <select 
            id="sortBy" 
            formControlName="sortBy"
            class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white py-2 px-3 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none"
          >
            <option value="createdAt">Date Created</option>
            <option value="name">Name</option>
            <option value="featureCategory">Category</option>
            <option value="featureType">Type</option>
          </select>
        </div>
  
        <div>
          <label for="sortDir" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Sort Direction</label>
          <select 
            id="sortDir" 
            formControlName="sortDir"
            class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white py-2 px-3 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none"
          >
            <option value="desc">Descending</option>
            <option value="asc">Ascending</option>
          </select>
        </div>
  
        <div class="col-span-1 md:col-span-2 lg:col-span-4 flex justify-end gap-3">
          <button 
            type="button" 
            (click)="resetFilters()"
            class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
          >
            Reset
          </button>
          <button 
            type="submit" 
            class="px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition-colors"
          >
            Apply Filters
          </button>
        </div>
      </form>
    </div>
  
    <!-- Loading State -->
    <div class="flex justify-center my-12" *ngIf="loading$ | async">
      <app-loading-spinner></app-loading-spinner>
    </div>
  
    <!-- Results -->
    <ng-container *ngIf="!(loading$ | async)">
      <div *ngIf="(features$ | async)?.content?.length; else noFeatures" class="mb-8">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
          <app-feature-card 
            *ngFor="let feature of (features$ | async)?.content"
            [feature]="feature"
            [isManager]="isManager"
            (delete)="confirmDelete(feature)"
          ></app-feature-card>
        </div>
        
        <!-- Pagination -->
        <div class="mt-8">
          <app-pagination
            [currentPage]="(currentPage$ | async) || 0"
            [totalPages]="(totalPages$ | async) || 0"
            [isFirstPage]="(isFirstPage$ | async) || true"
            [isLastPage]="(isLastPage$ | async) || true"
            (pageChange)="onPageChange($event)"
          ></app-pagination>
        </div>
      </div>
      
      <ng-template #noFeatures>
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-md p-12 text-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
          </svg>
          <h3 class="mt-4 text-lg font-medium text-gray-900 dark:text-white">No services found</h3>
          <p class="mt-1 text-gray-500 dark:text-gray-400">Try adjusting your search or filter criteria</p>
          <button 
            (click)="resetFilters()"
            class="mt-4 px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition-colors"
          >
            Reset Filters
          </button>
        </div>
      </ng-template>
    </ng-container>
  
    <!-- Confirmation Dialog -->
    <app-confirm-dialog
      [isOpen]="showDeleteConfirm"
      [title]="'Delete Service'"
      [message]="'Are you sure you want to delete this service? This action cannot be undone.'"
      [confirmText]="'Delete'"
      [cancelText]="'Cancel'"
      (confirm)="deleteFeature()"
      (cancel)="cancelDelete()"
    ></app-confirm-dialog>
  </div>
