<app-header></app-header>

<div class="min-h-screen bg-gradient-to-b from-[#f0f4f8] to-white">
  <!-- Hero Section -->
  <div class="relative bg-[#1a2942] text-white overflow-hidden">
    <!-- Background Pattern -->
 
    
    <div class="container mx-auto px-4 py-12 relative z-10">
      <div class="flex flex-col md:flex-row justify-between items-center gap-6">
        <div>
          <h1 class="text-4xl font-bold">
            Residence <span class="text-[#C5A47E]">Services</span>
          </h1>
          <p class="mt-3 text-gray-300 max-w-xl">
            Discover and manage all services and amenities available in your residence
          </p>
                   
        </div>
        
        <!-- Add Service Button (for managers) -->
        <div *ngIf="isManager">
          <a 
            routerLink="/features/new" 
            class="group relative overflow-hidden rounded-full bg-[#C5A47E] text-[#1a2942] px-6 py-3 font-medium shadow-lg shadow-[#C5A47E]/20 hover:shadow-[#C5A47E]/40 transition-all duration-300 flex items-center gap-2"
          >
            <div class="absolute inset-0 bg-white/30 transform -translate-x-full group-hover:translate-x-0 transition-transform duration-300 ease-out rounded-full"></div>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 relative" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
            </svg>
            <span class="relative">Add Service</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Category Pills -->
  <div class="container mx-auto px-4 py-6">
    <div class="flex flex-wrap gap-2">
      <button 
        *ngFor="let category of FeatureCategory | keyvalue"
        class="px-4 py-2 rounded-full text-sm font-medium transition-all duration-200 flex items-center gap-2"
        [ngClass]="filterForm.get('featureCategory')?.value === category.value ? 'bg-[#1a2942] text-white shadow-md' : 'bg-white text-gray-700 hover:bg-gray-100 shadow'"
        (click)="selectCategory(category.value)"
      >
        <i class="fas fa-{{ getCategoryIcon(category.value) }} text-xs"></i>
        {{ formatFeatureCategory(category.value) }}
      </button>
      <button 
        class="px-4 py-2 rounded-full text-sm font-medium transition-all duration-200 flex items-center gap-2 bg-white text-gray-700 hover:bg-gray-100 shadow"
        (click)="resetCategory()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        Reset
      </button>
    </div>
  </div>

  <!-- Filters -->
  <div class="container mx-auto px-4 mb-8">
    <div class="bg-white rounded-xl shadow-lg p-6">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-semibold text-[#1a2942]">Advanced Filters</h2>
        <button 
          type="button" 
          (click)="resetFilters()"
          class="text-sm text-gray-500 hover:text-[#1a2942] flex items-center gap-1"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          Reset All
        </button>
      </div>
      
      <form [formGroup]="filterForm" (ngSubmit)="applyFilters()" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <!-- Search -->
        <div class="col-span-1 md:col-span-2">
          <label for="search" class="block text-sm font-medium text-gray-700 mb-1">Search</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
              </svg>
            </div>
            <input 
              type="text" 
              id="search" 
              formControlName="search"
              placeholder="Search by name or description..." 
              class="pl-10 w-full rounded-lg border border-gray-200 bg-white text-gray-800 py-2 focus:ring-2 focus:ring-[#C5A47E] focus:border-[#C5A47E] outline-none"
            />
          </div>
        </div>
  
        <!-- Feature Type -->
        <div>
          <label for="featureType" class="block text-sm font-medium text-gray-700 mb-1">Service Type</label>
          <div class="relative">
            <select 
              id="featureType" 
              formControlName="featureType"
              class="w-full rounded-lg border border-gray-200 bg-white text-gray-800 py-2 px-3 focus:ring-2 focus:ring-[#C5A47E] focus:border-[#C5A47E] outline-none appearance-none"
            >
              <option [ngValue]="null">All Types</option>
              <option [ngValue]="FeatureType.SUBSCRIPTION_BASED">Subscription Based</option>
              <option [ngValue]="FeatureType.RESERVATION_BASED">Reservation Based</option>
            </select>
            <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </div>
        </div>
  
        <!-- Active Status -->
        <div>
          <label for="active" class="block text-sm font-medium text-gray-700 mb-1">Status</label>
          <div class="relative">
            <select 
              id="active" 
              formControlName="active"
              class="w-full rounded-lg border border-gray-200 bg-white text-gray-800 py-2 px-3 focus:ring-2 focus:ring-[#C5A47E] focus:border-[#C5A47E] outline-none appearance-none"
            >
              <option [ngValue]="null">All Statuses</option>
              <option [ngValue]="true">Active</option>
              <option [ngValue]="false">Inactive</option>
            </select>
            <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </div>
        </div>
  
        <!-- Sort -->
        <div class="col-span-1 md:col-span-2 lg:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Sort Options</label>
          <div class="grid grid-cols-2 gap-4">
            <div class="relative">
              <select 
                formControlName="sortBy"
                class="w-full rounded-lg border border-gray-200 bg-white text-gray-800 py-2 px-3 focus:ring-2 focus:ring-[#C5A47E] focus:border-[#C5A47E] outline-none appearance-none"
              >
                <option value="createdAt">Date Created</option>
                <option value="name">Name</option>
                <option value="featureCategory">Category</option>
                <option value="featureType">Type</option>
              </select>
              <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
              </div>
            </div>
            <div class="relative">
              <select 
                formControlName="sortDir"
                class="w-full rounded-lg border border-gray-200 bg-white text-gray-800 py-2 px-3 focus:ring-2 focus:ring-[#C5A47E] focus:border-[#C5A47E] outline-none appearance-none"
              >
                <option value="desc">Descending</option>
                <option value="asc">Ascending</option>
              </select>
              <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
              </div>
            </div>
          </div>
        </div>
  
        <div class="col-span-1 md:col-span-2 lg:col-span-2 flex items-end">
          <button 
            type="submit" 
            class="w-full px-4 py-2 bg-[#1a2942] text-white rounded-lg hover:bg-[#243a5e] transition-colors flex items-center justify-center gap-2"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
            </svg>
            Apply Filters
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Loading State -->
  <div class="container mx-auto px-4 py-12" *ngIf="loading$ | async">
    <div class="flex flex-col items-center justify-center">
      <app-loading-spinner></app-loading-spinner>
      <p class="mt-4 text-[#1a2942] font-medium">Loading services...</p>
    </div>
  </div>

  <!-- Results -->
  <div class="container mx-auto px-4 pb-16" *ngIf="!(loading$ | async)">
    <ng-container *ngIf="(features$ | async)?.content?.length; else noFeatures">
      <!-- Services Grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <app-feature-card 
          *ngFor="let feature of (features$ | async)?.content"
          [feature]="feature"
          [isManager]="isManager"
          (delete)="confirmDelete(feature)"
        ></app-feature-card>
      </div>
      
      <!-- Pagination -->
      <div class="mt-12">
        <app-pagination
          [currentPage]="(currentPage$ | async) || 0"
          [totalPages]="(totalPages$ | async) || 0"
          [isFirstPage]="(isFirstPage$ | async) || true"
          [isLastPage]="(isLastPage$ | async) || true"
          (pageChange)="onPageChange($event)"
        ></app-pagination>
      </div>
    </ng-container>
    
    <ng-template #noFeatures>
      <div class="bg-white rounded-2xl shadow-lg p-16 text-center">
        <div class="w-24 h-24 mx-auto bg-[#f0f4f8] rounded-full flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-[#9BA8A5]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
          </svg>
        </div>
        <h3 class="mt-6 text-xl font-bold text-[#1a2942]">No Services Found</h3>
        <p class="mt-2 text-gray-600 max-w-md mx-auto">We couldn't find any services matching your criteria. Try adjusting your filters or adding new services.</p>
        
        <div class="mt-8 flex flex-col sm:flex-row gap-4 justify-center">
          <button 
            (click)="resetFilters()"
            class="px-6 py-3 bg-[#f0f4f8] text-[#1a2942] rounded-lg hover:bg-[#e1e8f0] transition-colors flex items-center justify-center gap-2"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            Reset Filters
          </button>
          
          <a 
            *ngIf="isManager"
            routerLink="/features/new" 
            class="px-6 py-3 bg-[#1a2942] text-white rounded-lg hover:bg-[#243a5e] transition-colors flex items-center justify-center gap-2"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
            </svg>
            Add New Service
          </a>
        </div>
      </div>
    </ng-template>
  </div>

  <!-- Confirmation Dialog -->
  <app-confirm-dialog
    [isOpen]="showDeleteConfirm"
    [title]="'Delete Service'"
    [message]="'Are you sure you want to delete this service? This action cannot be undone.'"
    [confirmText]="'Delete'"
    [cancelText]="'Cancel'"
    (confirm)="deleteFeature()"
    (cancel)="cancelDelete()"
  ></app-confirm-dialog>
</div>
