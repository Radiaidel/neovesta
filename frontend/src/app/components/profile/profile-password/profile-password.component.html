
<div class="p-1">
  <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" class="space-y-8">
    <div class="space-y-6">
      <!-- Mot de passe actuel -->
      <div>
        <label for="currentPassword"
          class="block text-sm font-medium text-[#0A1C26] mb-2">Mot de passe
          actuel</label>
        <div class="relative">
          <div
            class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5 text-[#6B7D86]" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round"
                stroke-width="2"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
          </div>
          <input
            type="password"
            id="currentPassword"
            formControlName="currentPassword"
            class="w-full pl-10 pr-4 py-3 border border-[#9BA8A5] rounded-lg shadow-sm focus:ring-[#2D4E5B] focus:border-[#2D4E5B] bg-white">
        </div>
        <div
          *ngIf="passwordForm.get('currentPassword')?.invalid && passwordForm.get('currentPassword')?.touched"
          class="text-red-600 text-sm mt-2">
          Le mot de passe actuel est requis
        </div>
      </div>

      <!-- Nouveau mot de passe -->
      <div>
        <label for="newPassword"
          class="block text-sm font-medium text-[#0A1C26] mb-2">Nouveau mot de
          passe</label>
        <div class="relative">
          <div
            class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5 text-[#6B7D86]" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round"
                stroke-width="2"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
          </div>
          <input
            type="password"
            id="newPassword"
            formControlName="newPassword"
            class="w-full pl-10 pr-4 py-3 border border-[#9BA8A5] rounded-lg shadow-sm focus:ring-[#2D4E5B] focus:border-[#2D4E5B] bg-white">
        </div>
        <div
          *ngIf="passwordForm.get('newPassword')?.invalid && passwordForm.get('newPassword')?.touched"
          class="text-red-600 text-sm mt-2">
          <span *ngIf="passwordForm.get('newPassword')?.errors?.['required']">Le
            nouveau mot de passe est requis</span>
          <span
            *ngIf="passwordForm.get('newPassword')?.errors?.['minlength']">Minimum
            8 caractères</span>
        </div>
      </div>

      <!-- Confirmation -->
      <div>
        <label for="confirmPassword"
          class="block text-sm font-medium text-[#0A1C26] mb-2">Confirmation</label>
        <div class="relative">
          <div
            class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5 text-[#6B7D86]" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round"
                stroke-width="2"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
          </div>
          <input
            type="password"
            id="confirmPassword"
            formControlName="confirmPassword"
            class="w-full pl-10 pr-4 py-3 border border-[#9BA8A5] rounded-lg shadow-sm focus:ring-[#2D4E5B] focus:border-[#2D4E5B] bg-white">
        </div>
        <div
          *ngIf="passwordForm.get('confirmPassword')?.invalid && passwordForm.get('confirmPassword')?.touched"
          class="text-red-600 text-sm mt-2">
          <span
            *ngIf="passwordForm.get('confirmPassword')?.errors?.['required']">Confirmation
            requise</span>
          <span
            *ngIf="passwordForm.get('confirmPassword')?.errors?.['mustMatch']">Les
            mots de passe ne correspondent pas</span>
        </div>
      </div>
    </div>

    <!-- Bouton -->
    <div class="flex justify-end">
      <button
        type="submit"
        [disabled]="passwordForm.invalid || isSubmitting"
        class="px-8 py-3 bg-[#2D4E5B] text-white font-medium rounded-lg shadow-md hover:bg-[#0A1C26] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#C5A47E] transition-colors disabled:opacity-50">
        <div class="flex items-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2"
            fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round"
              stroke-width="2"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
          <span>{{ isSubmitting ? 'Mise à jour...' : 'Mettre à jour' }}</span>
        </div>
      </button>
    </div>
  </form>

  <!-- Messages -->
  <div *ngIf="errorMessage"
    class="mt-6 p-4 bg-red-50 border-l-4 border-red-500 rounded-r-md">
    <div class="flex items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-500 mr-2"
        fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
      <span class="text-red-700">{{ errorMessage }}</span>
    </div>
  </div>

  <div *ngIf="updateSuccess"
    class="mt-6 p-4 bg-green-50 border-l-4 border-green-500 rounded-r-md">
    <div class="flex items-center">
      <svg xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5 text-green-500 mr-2" fill="none" viewBox="0 0 24 24"
        stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M5 13l4 4L19 7" />
      </svg>
      <span class="text-green-700">Votre mot de passe a été mis à jour avec
        succès</span>
    </div>
  </div>
</div>
