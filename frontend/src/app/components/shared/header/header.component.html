<nav class="relative bg-indigo-800 shadow-lg z-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex items-center justify-between w-full">
                <a routerLink="/home" class="flex items-center">
                    <span
                        class="text-yellow-300 font-bold text-2xl tracking-wider">
                        Neo<span class="text-white">vesta</span>
                    </span>
                </a>

                <div *ngIf="isLoggedIn; else visitorMenu"
                    class="hidden sm:ml-10 sm:flex sm:space-x-6 mr-4">
                    <a routerLink="/home"
                        class="text-white hover:text-yellow-300 border-b-2 border-transparent hover:border-yellow-300 px-1 py-2 text-sm font-medium transition-colors duration-200">
                        Home
                    </a>
                    <a *ngIf="isAdminOrSuperAdmin "
                        routerLink="/residences"
                        class="text-white hover:text-yellow-300 border-b-2 border-transparent hover:border-yellow-300 px-1 py-2 text-sm font-medium transition-colors duration-200">
                        Manage Residences
                    </a>
                    <a *ngIf="isResidentOrManagerOrSubManager"
                        routerLink="/features"
                        class="text-white hover:text-yellow-300 border-b-2 border-transparent hover:border-yellow-300 px-1 py-2 text-sm font-medium transition-colors duration-200">
                        Features
                    </a>
                    <a *ngIf="isAdminOrSuperAdmin"
                        routerLink="/users"
                        class="text-white hover:text-yellow-300 border-b-2 border-transparent hover:border-yellow-300 px-1 py-2 text-sm font-medium transition-colors duration-200">
                        Manage Users
                    </a>
                    <a *ngIf="isManagerOrSubManager"
                        routerLink="/contracts"
                        class="text-white hover:text-yellow-300 border-b-2 border-transparent hover:border-yellow-300 px-1 py-2 text-sm font-medium transition-colors duration-200">
                        Manage Contracts
                    </a>
                    <a *ngIf="isManagerOrSubManager"
                        routerLink="/users"
                        class="text-white hover:text-yellow-300 border-b-2 border-transparent hover:border-yellow-300 px-1 py-2 text-sm font-medium transition-colors duration-200">
                        Manage Residents
                    </a>

                </div>
            </div>

            <ng-template #visitorMenu>
                <div
                    class="hidden sm:ml-6 sm:flex sm:items-center sm:space-x-4">
                    <a routerLink="/home"
                        class="text-white hover:text-yellow-300 border-b-2 border-transparent hover:border-yellow-300 px-1 py-2 text-sm font-medium transition-colors duration-200">
                        Home
                    </a>
                    <a routerLink="/login"
                        class="px-4 py-2 text-sm font-medium text-white bg-yellow-500 hover:bg-yellow-600 rounded-md shadow-md transition-colors duration-200">
                        Login
                    </a>
                </div>
            </ng-template>

            <div *ngIf="isLoggedIn" class="flex items-center space-x-4">

                <div class="relative">

                    <button
                        class="focus:outline-none rounded-full ring-2 ring-yellow-300 transition-all duration-200 hover:ring-4"
                        (click)="toggleDropdown()">
                        <img
                            *ngIf="currentUser?.profileImage; else defaultProfileImage"
                            class="w-10 h-10 rounded-full object-cover"
                            [src]="currentUser?.profileImage"
                            alt="Profile">
                        <ng-template #defaultProfileImage>
                            <div
                                class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center text-white font-bold">
                                {{ getInitials() }}
                            </div>
                        </ng-template>
                    </button>
                    <div *ngIf="dropdownOpen"
                        class="absolute right-0 mt-2 w-48 bg-white shadow-xl rounded-md overflow-hidden transition-all duration-200 z-20 border border-gray-200">
                        <span class=" ms-auto  block px-4 py-3 text-gray-800 hover:bg-gray-100 border-b border-gray-100 flex items-center">{{
                            currentUser?.firstName }} {{ currentUser?.lastName
                            }}</span>
                        <a routerLink="/profile"
                            class="block px-4 py-3 text-gray-800 hover:bg-gray-100 border-b border-gray-100 flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg"
                                class="h-4 w-4 mr-2" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round"
                                    stroke-linejoin="round" stroke-width="2"
                                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                            Profile
                        </a>
                        <button (click)="logout()"
                            class="block w-full text-left px-4 py-3 text-gray-800 hover:bg-gray-100 flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg"
                                class="h-4 w-4 mr-2" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round"
                                    stroke-linejoin="round" stroke-width="2"
                                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                            </svg>
                            Logout
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="sm:hidden">
        <button type="button" class="absolute top-4 right-4 text-white"
            (click)="toggleMobileMenu()">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                    stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
        <div *ngIf="mobileMenuOpen"
            class="px-2 pt-2 pb-3 space-y-1 bg-indigo-800 mt-16 absolute w-full left-0 z-10">
            <a routerLink="/home"
                class="block px-3 py-2 text-base font-medium text-white hover:bg-indigo-700 rounded-md">Home</a>
            <a *ngIf="isAdminOrSuperAdmin "
                routerLink="/residences"
                class="block px-3 py-2 text-base font-medium text-white hover:bg-indigo-700 rounded-md">Manage
                Residences</a>
            <a *ngIf="isAdminOrSuperAdmin" routerLink="/users"
                class="block px-3 py-2 text-base font-medium text-white hover:bg-indigo-700 rounded-md">Manage
                Users</a>
            <a *ngIf="isManagerOrSubManager" routerLink="/contracts"
                class="block px-3 py-2 text-base font-medium text-white hover:bg-indigo-700 rounded-md">Manage
                Contracts</a>
            <a *ngIf="isManagerOrSubManager" routerLink="/residents"
                class="block px-3 py-2 text-base font-medium text-white hover:bg-indigo-700 rounded-md">Manage
                Residents</a>
            <a *ngIf="isResidentOrManagerOrSubManager" routerLink="/features"
                class="block px-3 py-2 text-base font-medium text-white hover:bg-indigo-700 rounded-md">Features</a>
            <a *ngIf="isLoggedIn" routerLink="/profile"
                class="block px-3 py-2 text-base font-medium text-white hover:bg-indigo-700 rounded-md">Profile</a>
            <button *ngIf="isLoggedIn" (click)="logout()"
                class="block w-full text-left px-3 py-2 text-base font-medium text-white hover:bg-indigo-700 rounded-md">Logout</button>
        </div>
    </div>
</nav>
