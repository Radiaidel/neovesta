<app-header></app-header>
<div class="container mx-auto px-4 py-8">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
      <div>
        <h1 class="text-3xl font-bold text-gray-800 dark:text-white">Subscriptions</h1>
        <p class="text-gray-600 dark:text-gray-300 mt-1">
          <ng-container *ngIf="isManager && residenceName">Manage subscriptions for {{ residenceName }}</ng-container>
          <ng-container *ngIf="isResident">Manage your service subscriptions</ng-container>
          <ng-container *ngIf="!isManager && !isResident">Manage all subscriptions in the system</ng-container>
        </p>
      </div>
      <a 
        routerLink="/subscriptions/new" 
        class="bg-teal-600 hover:bg-teal-700 text-white px-6 py-2 rounded-lg shadow-md transition-all flex items-center gap-2"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
        </svg>
        New Subscription
      </a>
    </div>
  
    <!-- Filters -->
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-md p-6 mb-8">
      <h2 class="text-lg font-semibold mb-4 text-gray-800 dark:text-white">Filters</h2>
      <form [formGroup]="filterForm" (ngSubmit)="applyFilters()" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <!-- Search -->
        <div class="col-span-1 md:col-span-2">
          <label for="search" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Search</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
              </svg>
            </div>
            <input 
              type="text" 
              id="search" 
              formControlName="search"
              placeholder="Search by user or service name..." 
              class="pl-10 w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white py-2 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none"
            />
          </div>
        </div>
  
        <!-- Subscription Type -->
        <div>
          <label for="type" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Type</label>
          <select 
            id="type" 
            formControlName="type"
            class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white py-2 px-3 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none"
          >
            <option [ngValue]="null">All Types</option>
            <option [value]="SubscriptionType.MONTHLY">Monthly</option>
            <option [value]="SubscriptionType.YEARLY">YEARLY</option>
          </select>
        </div>
  
        <!-- Payment Status -->
        <div>
          <label for="paymentStatus" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Payment Status</label>
          <select 
            id="paymentStatus" 
            formControlName="paymentStatus"
            class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white py-2 px-3 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none"
          >
            <option [ngValue]="null">All Statuses</option>
            <option [value]="PaymentStatus.PENDING">Pending</option>
            <option [value]="PaymentStatus.PAID">Paid</option>
            <option [value]="PaymentStatus.FAILED">Failed</option>
            <option [value]="PaymentStatus.REFUNDED">Refunded</option>
            <option [value]="PaymentStatus.CANCELLED">Cancelled</option>
          </select>
        </div>
  
        <!-- Active Status -->
        <div>
          <label for="isActive" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Status</label>
          <select 
            id="isActive" 
            formControlName="isActive"
            class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white py-2 px-3 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none"
          >
            <option [ngValue]="null">All</option>
            <option [ngValue]="true">Active</option>
            <option [ngValue]="false">Inactive</option>
          </select>
        </div>
  
        <!-- Admin Confirmation -->
        <div *ngIf="isManager">
          <label for="isConfirmedByAdmin" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Admin Confirmation</label>
          <select 
            id="isConfirmedByAdmin" 
            formControlName="isConfirmedByAdmin"
            class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white py-2 px-3 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none"
          >
            <option [ngValue]="null">All</option>
            <option [ngValue]="true">Confirmed</option>
            <option [ngValue]="false">Not Confirmed</option>
          </select>
        </div>
  
        <!-- Start Date Range -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Start Date Range</label>
          <div class="grid grid-cols-2 gap-2">
            <input 
              type="date" 
              formControlName="startDateFrom"
              class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white py-2 px-3 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none"
            />
            <input 
              type="date" 
              formControlName="startDateTo"
              class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white py-2 px-3 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none"
            />
          </div>
        </div>
  
        <!-- End Date Range -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">End Date Range</label>
          <div class="grid grid-cols-2 gap-2">
            <input 
              type="date" 
              formControlName="endDateFrom"
              class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white py-2 px-3 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none"
            />
            <input 
              type="date" 
              formControlName="endDateTo"
              class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white py-2 px-3 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none"
            />
          </div>
        </div>
  
        <!-- Sort -->
        <div>
          <label for="sortBy" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Sort By</label>
          <div class="flex gap-2">
            <select 
              id="sortBy" 
              formControlName="sortBy"
              class="flex-1 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white py-2 px-3 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none"
            >
              <option value="startDate">Start Date</option>
              <option value="endDate">End Date</option>
              <option value="price">Price</option>
              <option value="type">Type</option>
              <option value="paymentStatus">Payment Status</option>
            </select>
            <select 
              id="sortDir" 
              formControlName="sortDir"
              class="w-24 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-white py-2 px-3 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none"
            >
              <option value="desc">DESC</option>
              <option value="asc">ASC</option>
            </select>
          </div>
        </div>
  
        <div class="col-span-1 md:col-span-2 lg:col-span-4 flex justify-end gap-3">
          <button 
            type="button" 
            (click)="resetFilters()"
            class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
          >
            Reset
          </button>
          <button 
            type="submit" 
            class="px-4 py-2 bg-teal-600 text-white rounded-lg hover:bg-teal-700 transition-colors"
          >
            Apply Filters
          </button>
        </div>
      </form>
    </div>
  
    <!-- Loading State -->
    <div class="flex justify-center my-12" *ngIf="loading$ | async">
      <app-loading-spinner></app-loading-spinner>
    </div>
  
    <!-- Results -->
    <ng-container *ngIf="!(loading$ | async)">
      <div *ngIf="(subscriptions$ | async)?.content?.length; else noSubscriptions" class="space-y-6 mb-8">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <app-subscription-card
            *ngFor="let subscription of (subscriptions$ | async)?.content"
            [subscription]="subscription"
            [isManager]="isManager"
            (delete)="confirmDelete(subscription)"
            (confirm)="confirmSubscription($event)"
            (refuse)="refuseSubscription($event)"
            (updatePayment)="updatePaymentStatus($event)"
          ></app-subscription-card>
        </div>
        
        <!-- Pagination -->
        <app-pagination
          [currentPage]="(currentPage$ | async) || 0"
          [totalPages]="(totalPages$ | async) || 0"
          [isFirstPage]="(isFirstPage$ | async) || true"
          [isLastPage]="(isLastPage$ | async) || true"
          (pageChange)="onPageChange($event)"
        ></app-pagination>
      </div>
      
      <ng-template #noSubscriptions>
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-md p-12 text-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
          <h3 class="mt-4 text-lg font-medium text-gray-900 dark:text-white">No subscriptions found</h3>
          <p class="mt-1 text-gray-500 dark:text-gray-400">
            <ng-container *ngIf="isResident">You don't have any subscriptions yet.</ng-container>
            <ng-container *ngIf="!isResident">There are no subscriptions matching your filters.</ng-container>
          </p>
          <ng-container *ngIf="isResident">
            <a 
              routerLink="/subscriptions/new"
              class="mt-4 inline-block px-4 py-2 bg-teal-600 text-white rounded-lg hover:bg-teal-700 transition-colors"
            >
              Subscribe to a Service
            </a>
          </ng-container>
          <ng-container *ngIf="!isResident">
            <button 
              (click)="resetFilters()"
              class="mt-4 px-4 py-2 bg-teal-600 text-white rounded-lg hover:bg-teal-700 transition-colors"
            >
              Reset Filters
            </button>
          </ng-container>
        </div>
      </ng-template>
    </ng-container>
  
    <!-- Confirmation Dialog -->
    <app-confirm-dialog
      [isOpen]="showDeleteConfirm"
      [title]="'Delete Subscription'"
      [message]="'Are you sure you want to delete this subscription? This action cannot be undone.'"
      [confirmText]="'Delete'"
      [cancelText]="'Cancel'"
      (confirm)="deleteSubscription()"
      (cancel)="cancelDelete()"
    ></app-confirm-dialog>
  </div>
