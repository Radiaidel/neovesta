<div class="min-h-screen bg-gray-50 py-8">
  <div class="container mx-auto px-4 max-w-4xl">

    <div class="flex items-center mb-8">
      <button 
        (click)="goBack()"
        class="mr-4 text-blue-900 hover:text-blue-700 transition-colors"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
      </button>
      <h1 class="text-2xl font-bold text-blue-900">Create New User</h1>
    </div>

    <div class="bg-white shadow-xl rounded-xl overflow-hidden border border-gray-100">
      <div class="bg-gradient-to-r from-blue-900 to-blue-800 h-16 relative">
        <div class="absolute top-0 right-0 h-16 w-32 overflow-hidden">
          <div class="absolute transform rotate-45 bg-yellow-500 w-16 h-64 -right-8 -top-32 opacity-20"></div>
          <div class="absolute transform rotate-45 bg-yellow-400 w-8 h-64 -right-2 -top-32 opacity-20"></div>
        </div>
        <div class="flex items-center h-full px-6">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
          </svg>
          <span class="ml-2 text-white font-medium">User Information</span>
        </div>
      </div>

      <div class="px-6 py-8">
        <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
          <div class="mb-8">
            <h2 class="text-lg font-medium text-blue-900 mb-4 flex items-center">
              <span class="inline-block w-8 h-8 rounded-full bg-blue-900 text-white text-sm flex items-center justify-center mr-2">1</span>
              Personal Details
            </h2>
            <div class="grid grid-cols-1 gap-y-6 gap-x-6 sm:grid-cols-2 bg-gray-50 p-6 rounded-lg border border-gray-100">
              <div>
                <label for="firstName" class="block text-sm font-medium text-gray-700 mb-1">First name</label>
                <div class="relative">
                  <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                  </div>
                  <input 
                    type="text" 
                    id="firstName" 
                    formControlName="firstName"
                    class="pl-10 shadow-sm focus:ring-blue-900 focus:border-blue-900 block w-full sm:text-sm border-gray-300 rounded-lg"
                    placeholder="Enter first name"
                  >
                </div>
                <div *ngIf="firstName?.invalid && (firstName?.dirty || firstName?.touched)" class="text-red-500 text-xs mt-1">
                  <div *ngIf="firstName?.errors?.['required']">First name is required</div>
                </div>
              </div>

              <div>
                <label for="lastName" class="block text-sm font-medium text-gray-700 mb-1">Last name</label>
                <div class="relative">
                  <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                  </div>
                  <input 
                    type="text" 
                    id="lastName" 
                    formControlName="lastName"
                    class="pl-10 shadow-sm focus:ring-blue-900 focus:border-blue-900 block w-full sm:text-sm border-gray-300 rounded-lg"
                    placeholder="Enter last name"
                  >
                </div>
                <div *ngIf="lastName?.invalid && (lastName?.dirty || lastName?.touched)" class="text-red-500 text-xs mt-1">
                  <div *ngIf="lastName?.errors?.['required']">Last name is required</div>
                </div>
              </div>
            </div>
          </div>

          <div class="mb-8">
            <h2 class="text-lg font-medium text-blue-900 mb-4 flex items-center">
              <span class="inline-block w-8 h-8 rounded-full bg-blue-900 text-white text-sm flex items-center justify-center mr-2">2</span>
              Contact Information
            </h2>
            <div class="grid grid-cols-1 gap-y-6 gap-x-6 sm:grid-cols-2 bg-gray-50 p-6 rounded-lg border border-gray-100">
              <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email address</label>
                <div class="relative">
                  <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                  </div>
                  <input 
                    type="email" 
                    id="email" 
                    formControlName="email"
                    class="pl-10 shadow-sm focus:ring-blue-900 focus:border-blue-900 block w-full sm:text-sm border-gray-300 rounded-lg"
                    placeholder="name@example.com"
                  >
                </div>
                <div *ngIf="email?.invalid && (email?.dirty || email?.touched)" class="text-red-500 text-xs mt-1">
                  <div *ngIf="email?.errors?.['required']">Email is required</div>
                  <div *ngIf="email?.errors?.['email']">Please enter a valid email</div>
                </div>
              </div>

              <div>
                <label for="phoneNumber" class="block text-sm font-medium text-gray-700 mb-1">Phone number</label>
                <div class="relative">
                  <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                    </svg>
                  </div>
                  <input 
                    type="text" 
                    id="phoneNumber" 
                    formControlName="phoneNumber"
                    class="pl-10 shadow-sm focus:ring-blue-900 focus:border-blue-900 block w-full sm:text-sm border-gray-300 rounded-lg"
                    placeholder="+XX XXX XXX XXXX"
                  >
                </div>
              </div>
            </div>
          </div>

          <div class="mb-8">
            <h2 class="text-lg font-medium text-blue-900 mb-4 flex items-center">
              <span class="inline-block w-8 h-8 rounded-full bg-blue-900 text-white text-sm flex items-center justify-center mr-2">3</span>
              Account Settings
            </h2>
            <div class="grid grid-cols-1 gap-y-6 gap-x-6 sm:grid-cols-2 bg-gray-50 p-6 rounded-lg border border-gray-100">
              <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <div class="relative">
                  <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                  </div>
                  <input 
                    type="password" 
                    id="password" 
                    formControlName="password"
                    class="pl-10 shadow-sm focus:ring-blue-900 focus:border-blue-900 block w-full sm:text-sm border-gray-300 rounded-lg"
                    placeholder="••••••••"
                  >
                </div>
                <div *ngIf="password?.invalid && (password?.dirty || password?.touched)" class="text-red-500 text-xs mt-1">
                  <div *ngIf="password?.errors?.['required']">Password is required</div>
                  <div *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters</div>
                </div>
              </div>

              <div>
                <label for="role" class="block text-sm font-medium text-gray-700 mb-1">Role</label>
                <div class="relative">
                  <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                    </svg>
                  </div>
                  <select 
                    id="role" 
                    formControlName="role"
                    class="pl-10 shadow-sm focus:ring-blue-900 focus:border-blue-900 block w-full sm:text-sm border-gray-300 rounded-lg"
                  >
                    <option value="" disabled selected>Select a role</option>
                    <option *ngFor="let role of availableRoles" [value]="role">{{ role }}</option>
                  </select>
                </div>
                <div *ngIf="role?.invalid && (role?.dirty || role?.touched)" class="text-red-500 text-xs mt-1">
                  <div *ngIf="role?.errors?.['required']">Role is required</div>
                </div>
              </div>
            </div>
          </div>

          
          <div class="flex justify-end items-center pt-6 border-t border-gray-200">
            <button 
              type="button" 
              (click)="goBack()"
              class="mr-4 inline-flex items-center px-4 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-900 transition-colors"
            >
              Cancel
            </button>
            <button 
              type="submit" 
              [disabled]="userForm.invalid || isSubmitting"
              class="inline-flex items-center px-6 py-2.5 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-blue-900 hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-900 disabled:opacity-50 transition-colors"
            >
              <span *ngIf="isSubmitting" class="mr-2">
                <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
              </span>
              <span>Create User</span>
              <span class="ml-1 bg-yellow-500 h-2 w-2 rounded-full"></span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
