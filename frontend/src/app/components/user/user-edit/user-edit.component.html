<div class="min-h-screen bg-gray-50 py-8">
  <div class="container mx-auto px-4 max-w-4xl">
    <div class="flex items-center mb-8">
      <button 
        (click)="goBack()"
        class="mr-4 text-blue-900 hover:text-blue-700 transition-colors"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
      </button>
      <h1 class="text-2xl font-bold text-blue-900">Edit User</h1>
    </div>

    <div class="bg-white shadow-xl rounded-xl overflow-hidden border border-gray-100">
      <div class="bg-gradient-to-r from-blue-900 to-blue-800 h-16 relative">
        <div class="absolute top-0 right-0 h-16 w-32 overflow-hidden">
          <div class="absolute transform rotate-45 bg-yellow-500 w-16 h-64 -right-8 -top-32 opacity-20"></div>
          <div class="absolute transform rotate-45 bg-yellow-400 w-8 h-64 -right-2 -top-32 opacity-20"></div>
        </div>
        <div class="flex items-center h-full px-6">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
          </svg>
          <span class="ml-2 text-white font-medium">User Information</span>
        </div>
      </div>

      <div class="px-6 py-8">
        <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
          <div class="mb-8">
            <h2 class="text-lg font-medium text-blue-900 mb-4">Personal Details</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
              <div>
                <label for="firstName" class="block text-sm font-medium text-gray-700">First Name</label>
                <input type="text" id="firstName" formControlName="firstName" class="border-gray-300 rounded-lg w-full">
              </div>
              <div>
                <label for="lastName" class="block text-sm font-medium text-gray-700">Last Name</label>
                <input type="text" id="lastName" formControlName="lastName" class="border-gray-300 rounded-lg w-full">
              </div>
            </div>
          </div>
          <div class="mb-8">
            <h2 class="text-lg font-medium text-blue-900 mb-4">Contact Information</h2>
            <div>
              <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
              <input type="email" id="email" formControlName="email" class="border-gray-300 rounded-lg w-full">
            </div>
          </div>
          <div class="flex justify-end">
            <button type="submit" class="bg-blue-900 text-white px-6 py-2 rounded-lg">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
